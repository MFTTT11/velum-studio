name: VELUM — Autonomous Broadcast Autopilot

on:
  schedule:
    # VELUM V3 7-day hyper-growth cadence: every 2 hours (12 runs/day ->
    # 4 full 4K Shorts production runs spaced >=3h apart across global peak windows
    # + 8 ultra-fast ~25s engagement, real-time velocity & title-rescue cycles)
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: "Video format override (auto | shorts | longform)"
        required: false
        default: "auto"
      dry_run:
        description: "Dry run without live YouTube upload or state.db commit (true | false)"
        required: false
        default: "false"
      force_produce:
        description: "Bypass daily cap & 3h spacing guard to produce immediately (true | false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: velum-broadcast-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install System FFmpeg & Broadcast Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-roboto fonts-liberation fonts-dejavu-core
          fc-cache -f

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Public Repository Security Lock
        run: |
          test -f .gitignore
          grep -q "client_secrets.json" .gitignore
          grep -q "token.json" .gitignore
          grep -q "output/" .gitignore
          grep -q "\*.mp4" .gitignore

      - name: Execute Autonomous Production, QA, Publish & Growth Cycle
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AUTOPILOT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          FMT="${{ github.event.inputs.format || 'auto' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FORCE="${{ github.event.inputs.force_produce || 'false' }}"
          EXTRA_ARGS=""
          if [ "$DRY" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi
          if [ "$FORCE" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-produce"
          fi
          python autopilot.py --run-once --format "$FMT" $EXTRA_ARGS

      - name: Security Wipe — Purge All Ephemeral Credentials & Media (ALWAYS)
        if: always()
        run: |
          rm -rf client_secrets.json token.json .env .env.* *.key *.pem secrets/ output/ *.mp4
          echo "Security wipe complete: zero credentials or media artifacts remain on disk."

      - name: Commit Only Clean state.db Back to Repository
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          test ! -f client_secrets.json
          test ! -f token.json
          test ! -f .env
          git config user.name "velum-broadcast-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(autopilot): update clean state.db [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No state.db changes to commit."
          fi
